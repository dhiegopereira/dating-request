<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💕 Um Pedido Especial 💕</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Ícone de configuração -->
  <button class="settings-btn" id="settings-btn" title="Configurações">⚙️</button>

  <!-- Modal de configurações -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <h2 class="modal-title">⚙️ Configurações</h2>
      <div class="modal-field">
        <label for="config-name">Nome da pessoa:</label>
        <input type="text" id="config-name" placeholder="Ex: Emanuelle" maxlength="30" />
      </div>
      <div class="modal-field">
        <label for="config-question">Pergunta:</label>
        <input type="text" id="config-question" placeholder="Ex: Quer namorar comigo?" maxlength="80" />
      </div>
      <div class="modal-buttons">
        <button class="modal-btn-save" id="modal-save">Salvar 💕</button>
        <button class="modal-btn-cancel" id="modal-cancel">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Corações flutuantes -->
  <div class="hearts-bg" id="hearts-bg"></div>

  <div class="card">

    <!-- Tela 1: Digite seu nome -->
    <div id="screen-name">
      <span class="emoji-top">💝</span>
      <h1 class="card-title">Um pedido especial</h1>
      <p class="card-subtitle">Para a pessoa mais especial do mundo</p>
      <div class="input-group">
        <input type="text" id="name-input" class="name-input" placeholder="Digite o nome da pessoa..." maxlength="30"
          autocomplete="off" />
        <button class="btn-continue" onclick="goToQuestionInput()">Continuar 💕</button>
      </div>
    </div>

    <!-- Tela 1.5: Digite a pergunta -->
    <div id="screen-question-input" style="display: none;">
      <span class="emoji-top">✍️</span>
      <h1 class="card-title">Qual a pergunta?</h1>
      <p class="card-subtitle">Escreva o que você quer perguntar</p>
      <div class="input-group">
        <input type="text" id="question-input" class="name-input" placeholder="Ex: Quer namorar comigo?" maxlength="80"
          autocomplete="off" />
        <button class="btn-continue" onclick="showQuestion()">Enviar 💌</button>
      </div>
    </div>

    <!-- Tela 2: A pergunta -->
    <div id="screen-question">
      <span class="big-heart">❤️</span>
      <p class="question-text" id="question-text"></p>
      <div class="buttons-wrapper" id="buttons-wrapper">
        <button class="btn-sim" id="btn-sim" onclick="showYes()">Sim 💖</button>
        <button class="btn-nao" id="btn-nao">Não 🙁</button>
      </div>
    </div>

    <!-- Tela 3: Resposta positiva -->
    <div id="screen-yes">
      <span class="yes-heart">🥰</span>
      <h2 class="yes-title">Eu sabia que diria SIM! 💕</h2>
      <p class="yes-subtitle">Você me fez o mais feliz do mundo! ❤️</p>

      <!-- Coloque a foto do casal como "couple.jpg" na mesma pasta -->
      <img src="couple.jpg" alt="Nossa foto ❤️" class="couple-photo"
        onerror="this.style.display='none'; document.getElementById('photo-placeholder').style.display='flex';" />
      <div class="photo-placeholder hidden" id="photo-placeholder">
        <span>📸</span>
        <p>Coloque a foto do casal<br />como <strong>couple.jpg</strong><br />na mesma pasta</p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
