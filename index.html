<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💔</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #2b2d42, #4a4e69, #6b6b83, #9a8c98);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      font-family: 'Nunito', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Chuva de fundo */
    .rain-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .drop {
      position: absolute;
      top: -10%;
      font-size: 1.4rem;
      opacity: 0;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.5;
      }

      100% {
        transform: translateY(115vh) rotate(20deg);
        opacity: 0;
      }
    }

    /* Card principal */
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 56px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      position: relative;
      z-index: 1;
      animation: cardPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes cardPop {
      0% {
        transform: scale(0.6);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .broken-heart {
      font-size: 5rem;
      display: block;
      margin-bottom: 18px;
      animation: sadBeat 2.4s ease-in-out infinite;
    }

    @keyframes sadBeat {

      0%,
      100% {
        transform: scale(1) translateY(0);
        opacity: 0.95;
      }

      50% {
        transform: scale(0.94) translateY(8px);
        opacity: 0.6;
      }
    }

    .sad-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.6rem;
      color: #4a4e69;
      margin-bottom: 18px;
    }

    .sad-title span {
      color: #6b6b83;
    }

    .sad-subtitle {
      font-size: 1.1rem;
      color: #6b6b83;
      line-height: 1.7;
    }

    .sad-subtitle span {
      color: #4a4e69;
      font-weight: 700;
    }

    .signature {
      margin-top: 28px;
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: #9a8c98;
    }
  </style>
</head>

<body>

  <div class="card">
    <span class="broken-heart">💔</span>
    <h1 class="sad-title">Tudo bem, <span>Kevia</span>...</h1>
    <p class="sad-subtitle" id="sad-subtitle">
      Eu tentei. 🥺<br />
      Não sou lá o último romântico do mundo,<br />
      mas com você eu quis arriscar mesmo assim.<br />
      Obrigado por ter sido sincera, <span>Kevia</span>. 🤍
    </p>
    <p class="signature">— ainda assim, com carinho 🤍</p>
  </div>

</body>

</html>
